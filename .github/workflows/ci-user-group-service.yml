# =============================================================================
# CI/CD — user-group-service
# Disciplina: DevOps — Trabalho Prático 2
#
# O que este pipeline faz:
#   1. Roda os testes automatizados com cobertura (JaCoCo)
#   2. Analisa qualidade do código no SonarCloud
#   3. Gera a imagem Docker e publica no Docker Hub
#   4. Faz deploy automático no Render
#
# Quando dispara:
#   - Push na branch develop → ambiente DEV
#   - Push na branch main    → ambiente HOMOL
# =============================================================================

name: CI/CD — User Group Service

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'user-group-service/**'
      - '.github/workflows/ci-user-group-service.yml'

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1: Testes + Qualidade
  # Roda os testes unitários, gera relatório JaCoCo e envia para SonarCloud
  # ---------------------------------------------------------------------------
  testes-e-qualidade:
    name: Testes e Análise de Qualidade
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # necessário para o SonarCloud analisar histórico

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Executar testes e gerar relatório de cobertura
        working-directory: user-group-service
        run: ./mvnw verify -B
        # O 'verify' executa: compile → test → jacoco:report

      - name: Enviar análise para o SonarCloud
        working-directory: user-group-service
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_F }}
        run: ./mvnw sonar:sonar -B -Dsonar.branch.name=${{ github.ref_name }}

  # ---------------------------------------------------------------------------
  # JOB 2: Build e Publicação da Imagem Docker
  # Só roda se os testes passarem (needs: testes-e-qualidade)
  # ---------------------------------------------------------------------------
  build-e-publicacao:
    name: Build e Publicação Docker
    runs-on: ubuntu-latest
    needs: testes-e-qualidade

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME_F }}
          password: ${{ secrets.DOCKER_PASSWORD_F }}

      - name: Definir tag da imagem baseada na branch
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TAG=homol" >> $GITHUB_OUTPUT
          else
            echo "TAG=dev" >> $GITHUB_OUTPUT
          fi
        # develop → tag 'dev'   → imagem: felipemaier/user-group-service:dev
        # main    → tag 'homol' → imagem: felipemaier/user-group-service:homol

      - name: Build e push da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: user-group-service
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME_F }}/user-group-service:${{ steps.tag.outputs.TAG }}
            ${{ secrets.DOCKER_USERNAME_F }}/user-group-service:latest

  # ---------------------------------------------------------------------------
  # JOB 3: Deploy no Render
  # Aciona o deploy automático via webhook do Render
  # Só roda após o build da imagem ser publicado
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy no Render
    runs-on: ubuntu-latest
    needs: build-e-publicacao

    steps:
      - name: Acionar deploy no Render
        env:
          RENDER_DEPLOY_HOOK: ${{ github.ref_name == 'main' && secrets.RENDER_DEPLOY_HOOK_HOMOL_F || secrets.RENDER_DEPLOY_HOOK_DEV_F }}
        run: |
          curl -s -X POST "$RENDER_DEPLOY_HOOK" | jq .
        # develop → RENDER_DEPLOY_HOOK_DEV_F   (ambiente DEV  — Swagger habilitado)
        # main    → RENDER_DEPLOY_HOOK_HOMOL_F  (ambiente HOMOL — Swagger desabilitado)
