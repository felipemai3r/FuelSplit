# Swagger habilitado apenas no DEV para facilitar testes manuais
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    enabled: true

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true  # formata o SQL no console, facilita leitura durante debug

# Logs detalhados para acompanhar o fluxo durante desenvolvimento
logging:
  level:
    com.caronatracker: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
