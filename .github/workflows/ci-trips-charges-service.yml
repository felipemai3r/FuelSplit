# =============================================================================
# CI/CD — trips-charges-service
# Disciplina: DevOps — Trabalho Prático 2
#
# O que este pipeline faz:
#   1. Roda os testes automatizados com cobertura (JaCoCo)
#   2. Analisa qualidade do código no SonarCloud
#   3. Gera a imagem Docker e publica no Docker Hub
#   4. Faz deploy automático no Render
#
# Quando dispara:
#   - Push na branch develop → ambiente DEV
#   - Push na branch main    → ambiente HOMOL
# =============================================================================

name: CI/CD — Trips & Charges Service

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'trips-charges-service/**'
      - '.github/workflows/ci-trips-charges-service.yml'

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1: Testes + Qualidade
  # Roda os testes unitários, gera relatório JaCoCo e envia para SonarCloud
  # ---------------------------------------------------------------------------
  testes-e-qualidade:
    name: Testes e Análise de Qualidade
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # necessário para o SonarCloud analisar histórico

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Executar testes e gerar relatório de cobertura
        working-directory: trips-charges-service
        run: ./mvnw verify -B
        # O 'verify' executa: compile → test → jacoco:report
        # O H2 (banco em memória) é usado nos testes, sem precisar de PostgreSQL

      - name: Enviar análise para o SonarCloud
        working-directory: trips-charges-service
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_D }}
        run: ./mvnw sonar:sonar -B
        # O pom.xml já tem sonar.host.url=https://sonarcloud.io
        # e sonar.organization=diogoruan configurados

  # ---------------------------------------------------------------------------
  # JOB 2: Build e Publicação da Imagem Docker
  # Só roda se os testes passarem (needs: testes-e-qualidade)
  # ---------------------------------------------------------------------------
  build-e-publicacao:
    name: Build e Publicação Docker
    runs-on: ubuntu-latest
    needs: testes-e-qualidade  # só executa se o Job 1 passar

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v6

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME_D }}
          password: ${{ secrets.DOCKER_PASSWORD_D }}

      - name: Definir tag da imagem baseada na branch
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TAG=homol" >> $GITHUB_OUTPUT
          else
            echo "TAG=dev" >> $GITHUB_OUTPUT
          fi
        # develop → tag 'dev'   → imagem: diogoruan/trips-charges-service:dev
        # main    → tag 'homol' → imagem: diogoruan/trips-charges-service:homol

      - name: Build e push da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: trips-charges-service
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME_D }}/trips-charges-service:${{ steps.tag.outputs.TAG }}
            ${{ secrets.DOCKER_USERNAME_D }}/trips-charges-service:latest

  # ---------------------------------------------------------------------------
  # JOB 3: Deploy no Render
  # Aciona o deploy automático via webhook do Render
  # Só roda após o build da imagem ser publicado
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy no Render
    runs-on: ubuntu-latest
    needs: build-e-publicacao

    steps:
      - name: Acionar deploy no Render
        env:
          RENDER_DEPLOY_HOOK: ${{ github.ref_name == 'main' && secrets.RENDER_DEPLOY_HOOK_HOMOL_D || secrets.RENDER_DEPLOY_HOOK_DEV_D }}
        run: |
          curl -s -X POST "$RENDER_DEPLOY_HOOK" | jq .
        # O webhook é gerado no painel do Render ao criar o serviço
        # Será configurado na Etapa 3 (CD)
